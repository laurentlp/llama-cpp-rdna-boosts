# Build the patched llama-swap:rocm image and publish it as
# ghcr.io/laurentlp/llama-swap-rdna (mirrors the mempalace self-publish pattern).
# Rebuilds when the Dockerfile, the patch set, or this workflow changes, plus
# manual dispatch (e.g. after syncing the fork or bumping LLAMA_FORK_POINT).
name: build-rdna

on:
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - "patches/**"
      - "scripts/apply-all.sh"
      - ".github/workflows/build-rdna.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: [self-hosted, bear]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        id: meta
        with:
          images: ghcr.io/laurentlp/llama-swap-rdna
          tags: |
            type=raw,value=latest
            type=sha

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: ./Dockerfile
          # single-arch homelab (amd64, gfx1201 baked in via GPU_TARGETS)
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=llama-swap-rdna
          cache-to: type=gha,mode=max,scope=llama-swap-rdna
