# Build the patched llama-swap:rocm image and publish it as
# ghcr.io/laurentlp/llama-swap-rdna (mirrors the mempalace self-publish pattern).
# Rebuilds when the Dockerfile, the patch set, or this workflow changes, plus
# manual dispatch (e.g. after syncing the fork or bumping LLAMA_FORK_POINT).
name: build-rdna

on:
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - "patches/**"
      - "scripts/apply-all.sh"
      - ".github/workflows/build-rdna.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: [self-hosted, bear]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3
        with:
          # docker driver uses the daemon's built-in buildkit over POST /build
          # (proxy-safe). The default docker-container driver needs an attach/
          # hijack upgrade the socket-proxy blocks (403) — that would require
          # EXEC=1, deliberately not enabled. Single-arch build needs nothing more.
          driver: docker

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/laurentlp/llama-swap-rdna
          tags: |
            type=raw,value=latest
            type=sha

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          # single-arch homelab (amd64, gfx1201 baked in via GPU_TARGETS)
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=llama-swap-rdna
          cache-to: type=gha,mode=max,scope=llama-swap-rdna
